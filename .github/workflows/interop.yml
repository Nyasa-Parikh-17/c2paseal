name: interop

# Regenerates INTEROP.md with every validator installed. Runs on version
# tags, and by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  C2PATOOL_VERSION: "0.27.21"
  C2PA_MCP_VERSION: "v0.7.1"

jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # 1. Verify c2pa-mcp installs first. If this fails the job fails; the
      #    harness never falls back to the richardwooding/c2pa library.
      - name: Install and check c2pa-mcp
        run: |
          go install "github.com/richardwooding/c2pa-mcp@${C2PA_MCP_VERSION}"
          "$(go env GOPATH)/bin/c2pa-mcp" verify --help > /dev/null
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # 2. c2patool, the Content Authenticity Initiative's official CLI and
      #    this project's oracle, is the second validator. Built with cargo
      #    (preinstalled on GitHub's Ubuntu runners) at a pinned version.
      - name: Cache c2patool
        id: c2patool-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/c2patool
          key: c2patool-${{ env.C2PATOOL_VERSION }}-${{ runner.os }}
      - name: Install c2patool
        if: steps.c2patool-cache.outputs.cache-hit != 'true'
        run: cargo install c2patool --version "${C2PATOOL_VERSION}" --locked
      - name: Check c2patool
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/c2patool" --version

      # 3. Regenerate the report. -require fails the job if either tool is
      #    missing; -strict fails it on any unexplained disagreement.
      - name: Run the interop harness
        run: go run ./interop -require c2patool,c2pa-mcp -strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INTEROP.md
          path: INTEROP.md
