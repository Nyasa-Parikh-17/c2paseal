name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  C2PATOOL_VERSION: 0.27.21

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # CLAUDE.md rule 2: the core module depends on these three only. Key
      # providers with cloud SDKs live in their own modules (keys/*).
      - name: Core dependencies
        run: |
          got=$(go list -m -f '{{if and (not .Main) (not .Indirect)}}{{.Path}}{{end}}' all | sort | tr '\n' ' ')
          want="github.com/digitorus/timestamp github.com/fxamacker/cbor/v2 github.com/veraison/go-cose "
          echo "direct dependencies: $got"
          [ "$got" = "$want" ] || { echo "core go.mod changed: want $want"; exit 1; }
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2 # 2026.2.2; 2026.2.1 cannot read go1.27.4 export data
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Test
        run: go test ./...

  # The WebAssembly build (cmd/c2paseal-wasm) and the web app over it: built
  # once with the release flags, held to its size budget and run in headless
  # Chrome, which the Ubuntu 24.04 runner image includes. No browser test
  # tool is installed: the tests start Chrome themselves and read the
  # results their test pages POST back. TestSite drives the web app (also
  # offline, and under serve).
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build c2paseal.wasm
        run: |
          mkdir -p dist-wasm
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o dist-wasm/c2paseal.wasm ./cmd/c2paseal-wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" dist-wasm/
          raw=$(wc -c < dist-wasm/c2paseal.wasm); gz=$(gzip -9 -c dist-wasm/c2paseal.wasm | wc -c)
          echo "c2paseal.wasm: $raw bytes, $gz gzipped (gzip -9)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Vet and staticcheck (js/wasm)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          GOOS=js GOARCH=wasm go vet ./cmd/c2paseal-wasm
          GOOS=js GOARCH=wasm "$(go env GOPATH)/bin/staticcheck" ./cmd/c2paseal-wasm
      - name: Size budget and browser tests
        env:
          C2PASEAL_WASM: ${{ github.workspace }}/dist-wasm/c2paseal.wasm
          C2PASEAL_BROWSER_TEST: "1"
        run: |
          google-chrome --version
          go test -v -run 'TestWasmSize|TestBrowser|TestSite' ./cmd/c2paseal-wasm
      - uses: actions/upload-artifact@v7
        with:
          name: c2paseal-wasm
          path: dist-wasm/

  # Key providers in their own modules (keys/awskms, keys/gcpkms), tested
  # against fake KMS endpoints; files they sign must verify in c2patool. A
  # real KMS is used only if the repository has the secrets (see each
  # module's TestRealKMS); otherwise those tests skip.
  keys:
    strategy:
      fail-fast: false
      matrix:
        module: [keys/awskms, keys/gcpkms]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      C2PASEAL_REQUIRE_C2PATOOL: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Cache c2patool
        id: c2patool-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/c2patool
          key: c2patool-${{ env.C2PATOOL_VERSION }}-ubuntu-24.04
      - name: Install c2patool
        if: steps.c2patool-cache.outputs.cache-hit != 'true'
        run: cargo install c2patool --version "${C2PATOOL_VERSION}" --locked
      - name: Check c2patool
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/c2patool" --version
      - name: Vet and staticcheck
        run: |
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Google credentials (only with the repository secret)
        if: matrix.module == 'keys/gcpkms'
        env:
          GCP_CREDENTIALS: ${{ secrets.C2PASEAL_GCP_CREDENTIALS }}
        run: |
          if [ -n "$GCP_CREDENTIALS" ]; then
            printf '%s' "$GCP_CREDENTIALS" > "$RUNNER_TEMP/gcp.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp.json" >> "$GITHUB_ENV"
          fi
      - name: Test
        env:
          C2PASEAL_AWSKMS_KEY: ${{ secrets.C2PASEAL_AWSKMS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.C2PASEAL_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.C2PASEAL_AWS_SECRET_ACCESS_KEY }}
          C2PASEAL_GCPKMS_KEY: ${{ secrets.C2PASEAL_GCPKMS_KEY }}
        run: go test -v ./...

  # sealsvc (its own module): tests, including signing through a fake AWS
  # KMS, then the container image built and used for real.
  sealsvc:
    runs-on: ubuntu-24.04
    env:
      C2PASEAL_REQUIRE_C2PATOOL: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: cmd/sealsvc/go.mod
          cache-dependency-path: cmd/sealsvc/go.sum
      - name: Cache c2patool
        id: c2patool-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/c2patool
          key: c2patool-${{ env.C2PATOOL_VERSION }}-ubuntu-24.04
      - name: Install c2patool
        if: steps.c2patool-cache.outputs.cache-hit != 'true'
        run: cargo install c2patool --version "${C2PATOOL_VERSION}" --locked
      - name: Check c2patool
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/c2patool" --version
      - name: Vet, staticcheck and test
        working-directory: cmd/sealsvc
        run: |
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go test -v ./...
      - name: Build the image
        run: docker build -f cmd/sealsvc/Dockerfile --build-arg VERSION=ci -t sealsvc:ci .
      - name: Run the image (TEST ONLY key)
        run: |
          out=$(docker run --rm sealsvc:ci hash-key)
          key=$(printf '%s\n' "$out" | sed -n 's/^API key.*: //p')
          hash=$(printf '%s\n' "$out" | sed -n 's/^line for the API key file:  <name> //p')
          mkdir -p "$RUNNER_TEMP/cfg"
          echo "ci $hash" > "$RUNNER_TEMP/cfg/keys.txt"
          cp testdata/pki/leaf-chain.pem testdata/pki/leaf.key testdata/pki/trust-anchors.pem "$RUNNER_TEMP/cfg/"
          chmod -R a+rX "$RUNNER_TEMP/cfg"
          docker run -d --name sealsvc -p 127.0.0.1:8080:8080 -v "$RUNNER_TEMP/cfg:/config:ro" --read-only --cap-drop ALL sealsvc:ci \
            --cert /config/leaf-chain.pem --key /config/leaf.key --api-keys /config/keys.txt --trust /config/trust-anchors.pem
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS -H "Authorization: Bearer $key" --data-binary @testdata/unsigned/small.jpg -o signed.jpg http://127.0.0.1:8080/v1/sign
          c2patool signed.jpg --detailed trust --trust_anchors testdata/pki/trust-anchors.pem | jq -e '.validation_state == "Trusted"'
          curl -fsS -H "Authorization: Bearer $key" --data-binary @signed.jpg http://127.0.0.1:8080/v1/verify | jq -e '.validation_state == "Trusted"'
          code=$(curl -s -o /dev/null -w '%{http_code}' --data-binary @signed.jpg http://127.0.0.1:8080/v1/sign)
          [ "$code" = 401 ]
          docker exec sealsvc /sealsvc healthcheck
          [ "$(docker inspect -f '{{.Config.User}}' sealsvc:ci)" = "nonroot:nonroot" ]
          docker logs sealsvc 2>&1 | tail -5
          echo "image size: $(docker image inspect -f '{{.Size}}' sealsvc:ci) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
