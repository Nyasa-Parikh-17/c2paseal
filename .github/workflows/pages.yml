name: pages

# The website moved to its own repository (c2paseal-website). This publishes
# web/moved at the old address, https://nyasa-parikh-17.github.io/c2paseal/,
# so old links redirect to the same page on the new site. See
# web/moved/README.md.

on:
  push:
    branches: [main]
    paths:
      - web/moved/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Assemble the redirect site
        run: |
          mkdir -p _site
          cp web/moved/index.html web/moved/404.html web/moved/moved.js web/moved/sw.js _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
